syntax = "proto3";

package tknz.detail;

option go_package = "go.tknz.dev/internal/pb";

message Claims {
	optional string aud = 1;
	optional string iss = 2;
	optional string sub = 3;
}

message Token {
	// Token id
	bytes id = 1;

	// Token claims
	Claims claims = 4;

	// Token signature
	bytes signature = 2;

	// Key id used for the token signature
	string kid = 3;
}
