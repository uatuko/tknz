name: Publish
on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

# Images are pushed to ghcr.io by digest only (untagged). Only the final `tknz` image is tagged (and pushed to docker
# hub) by the `container` job once all images are built successfully. `app` and `tmpl` images are intermediate build
# artifacts and remain untagged.
concurrency:
  group: ${{ github.workflow_ref }}

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-app
      - name: Build and publish (by digest)
        uses: docker/build-push-action@v7
        id: build
        with:
          annotations: ${{ steps.meta.outputs.annotations }}
          context: app
          file: app/Containerfile
          outputs: type=image,name=ghcr.io/${{ github.repository }}-app,push-by-digest=true,name-canonical=true,push=true
          platforms: |
            linux/amd64
            linux/arm64

  tmpl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-tmpl
      - name: Build and publish (by digest)
        uses: docker/build-push-action@v7
        id: build
        with:
          annotations: ${{ steps.meta.outputs.annotations }}
          context: tmpl
          file: tmpl/Containerfile
          outputs: type=image,name=ghcr.io/${{ github.repository }}-tmpl,push-by-digest=true,name-canonical=true,push=true
          platforms: |
            linux/amd64
            linux/arm64

  tknz:
    runs-on: ubuntu-latest
    needs:
      - app
      - tmpl
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      - name: Build and publish (by digest)
        uses: docker/build-push-action@v7
        id: build
        with:
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            app_image=ghcr.io/${{ github.repository }}-app@${{ needs.app.outputs.digest }}
            tmpl_image=ghcr.io/${{ github.repository }}-tmpl@${{ needs.tmpl.outputs.digest }}
          context: .
          file: Containerfile
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          platforms: |
            linux/amd64
            linux/arm64

  container:
    runs-on: ubuntu-latest
    needs:
      - tknz
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Tag image
        if: steps.meta.outputs.tags != ''
        env:
          DIGEST: ${{ needs.tknz.outputs.digest }}
          REPO: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          for tag in ${TAGS}; do
            args+=(--tag "${tag}")
          done

          docker buildx imagetools create "${args[@]}" "${REPO}@${DIGEST}"

  cleanup:
    runs-on: ubuntu-latest
    needs:
      - container
    # Run even when builds (or container) fail to remove untagged images pushed by failed runs
    if: ${{ !cancelled() }}
    permissions:
      packages: write
    steps:
      - name: Extract repo name
        id: repo
        run: echo "name=$(basename ${{ github.repository }})" >> $GITHUB_OUTPUT
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.repo.outputs.name }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.repo.outputs.name }}-app
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.repo.outputs.name }}-tmpl
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
